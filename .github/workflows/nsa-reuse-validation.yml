name: Validate unchanged nonlinear and SDIRK suites
on:
  push:
    branches: [ci/validate-nsa-reuse]
permissions:
  contents: read
jobs:
  original-tests:
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10.12', '1.13.1']
        package: [OrdinaryDiffEqNonlinearSolve, OrdinaryDiffEqSDIRK]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      OPENBLAS_NUM_THREADS: '1'
      GROUP: Core
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '${{ matrix.version }}'
      - uses: julia-actions/cache@v3
      - name: Prepare original package test dependencies
        run: julia --startup-file=no .github/diagnostics/full_nonlinear.jl '${{ matrix.package }}'
      - name: Run complete unchanged Core suite with CI bounds and coverage
        run: julia --startup-file=no --check-bounds=auto --threads=2 --code-coverage='@lib/${{ matrix.package }}' --project=.validation-env 'lib/${{ matrix.package }}/test/runtests.jl'
