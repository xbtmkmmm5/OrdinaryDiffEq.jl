name: Validate combined nonlinear fixes with unchanged suites
on:
  push:
    branches: [ci/validate-nsa-reuse]
permissions:
  contents: read
jobs:
  original-tests:
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10.12', '1.13.1']
        package: [OrdinaryDiffEqNonlinearSolve, SimpleNonlinearSolve]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      OPENBLAS_NUM_THREADS: '1'
      GROUP: Core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: xbtmkmmm5/NonlinearSolve.jl
          ref: 7a2f4658cb870835c7e2baf2d193a7ce400df283
          path: nonlinear-dependency
      - uses: julia-actions/setup-julia@v3
        with:
          version: '${{ matrix.version }}'
      - uses: julia-actions/cache@v3
      - name: Prepare original package test dependencies
        run: julia --startup-file=no .github/diagnostics/full_nonlinear.jl '${{ matrix.package }}'
      - name: Run complete unchanged Core suite with CI bounds and coverage
        run: |
          source_root=.
          if [ '${{ matrix.package }}' = SimpleNonlinearSolve ]; then source_root=nonlinear-dependency; fi
          julia --startup-file=no --check-bounds=auto --threads=2 --code-coverage="@$source_root/lib/${{ matrix.package }}" --project=.validation-env "$source_root/lib/${{ matrix.package }}/test/runtests.jl"
